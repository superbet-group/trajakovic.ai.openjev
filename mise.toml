# OpenJev tooling. Everything the project needs comes from mise: Python and Node here,
# Python packages and the model via `mise run install`. Tasks live in mise-tasks/
# (one executable script per task): `mise tasks ls`.
min_version = "2025.1.0"

[tools]
python = "3.12"
node = "24"

[env]
_.python.venv = { path = ".venv", create = true, uv_create_args = ["--seed"] }
